<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vise en place</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header id="topbar">
        <div class="brand">
            <span class="brand-name">Vise en place</span>
            <span id="versionTag" class="version"></span>
        </div>
        <div class="top-center">
            <div class="top-side top-side--left">
                <button id="backBtn" hidden>◀ Recipes</button>
            </div>
            <span id="recipeTitle" spellcheck="false"></span>
            <div class="top-side top-side--right">
                <button id="cookBtn" class="cook-toggle" hidden>Cook</button>
                <button id="exportImageBtn" hidden>Export Image</button>
            </div>
        </div>
        <div class="top-right">
            <label class="row-height-ctl" id="rowHeightCtl" title="Height of each step row (px)" hidden>Row height
                <input type="range" id="rowHeightInput" min="14" max="60" step="1" value="20" />
                <output id="rowHeightOut">20</output>
            </label>
            <button id="fullscreenBtn" title="Toggle fullscreen">Fullscreen</button>
        </div>
    </header>

    <div id="appBody">
        <section id="folderView">
            <div id="folderGrid"></div>
        </section>
        <main id="canvasWrap" hidden>
            <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
        </main>
    </div>

    <footer id="cookBar" hidden>
        <div class="cook-nav">
            <button id="cookBack">◀ Back</button>
            <span id="cookStatus">Step 1</span>
            <button id="cookNext" class="cook-primary">Next ▶</button>
            <button id="cookRestart">Restart</button>
        </div>
        <div class="cook-mic">
            <button id="cookMic">Listen for finger snaps</button>
            <div id="cookMeter" class="cook-meter" title="Mic level (dashed line = trigger level)">
                <div id="cookMeterBar"></div>
            </div>
            <label>Sensitivity <input type="range" id="cookSens" min="1" max="10" value="5" /></label>
            <span id="cookMicMsg"></span>
        </div>
        <div id="cookTimers"></div>
    </footer>

    <script src="js/version.js"></script>
    <script src="recipes/recipes.js"></script>
    <script src="js/model.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/export.js"></script>
    <script src="js/library.js"></script>
    <script src="js/folder.js"></script>
    <script src="js/interact.js"></script>
    <script src="js/cook.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
